<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Archivo — Game Info</title>
  <link rel="stylesheet" href="Styles.css" />

  <style>
    .game-info {
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
      background: rgba(0,0,0,0.6);
      border-radius: 10px;
      color: #fff;
    }
    .back-btn {
    position: relative;
    z-index: 99999 !important;
    pointer-events: auto !important;
  }

  .game-info {
    position: relative;
    z-index: 9999 !important;
  }
    .back-btn {
  background: linear-gradient(90deg, #0077ff, #0055cc);
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  font-family: "Orbitron", sans-serif;
  letter-spacing: 1px;
  cursor: pointer;
  transition: 0.3s ease;
  box-shadow: 0 0 10px rgba(0, 120, 255, 0.4);
}

.back-btn:hover {
  filter: brightness(1.2);
  box-shadow: 0 0 14px rgba(0, 150, 255, 0.6);
}

  </style>
  
</head>

<body class="login-body">
  <main class="game-info">
    <button class="back-btn" onclick="goBack()">← Back</button>

    <div id="content">Loading...</div>
  </main>

  <script src="auth.js"></script>
  <script src="gameInfo.js"></script>

  <script>
  function goBack() {
    if (document.referrer && document.referrer.includes("catalog")) {
      window.history.back();
    } else {
      window.location.href = "catalog.html";
    }
  }
  </script>

</body>
</html>
